name: Feature request
description: Suggest a new language, framework, view or output
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Mention example repositories if it is about a language or framework.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
